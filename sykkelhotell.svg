<svg xmlns="http://w3.org" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background House Shape -->
  <path d="M 50,5 L 95,35 L 95,85 A 10,10 0 0 1 85,95 L 15,95 A 10,10 0 0 1 5,85 L 5,35 Z" fill="#3A3A3A"/>
  
  <!-- Bicycle Group -->
  <g fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Rear Wheel -->
    <circle cx="34" cy="65" r="13" />
    <!-- Front Wheel -->
    <circle cx="66" cy="65" r="13" />
    
    <!-- Frame Structure -->
    <!-- Rear Hub to Bottom Bracket -->
    <line x1="34" y1="65" x2="48" y2="65" />
    <!-- Rear Hub to Seat -->
    <line x1="34" y1="65" x2="42" y2="44" />
    <!-- Bottom Bracket to Seat (Seat Tube) -->
    <line x1="48" y1="65" x2="42" y2="44" />
    <!-- Bottom Bracket to Head Tube (Down Tube) -->
    <line x1="48" y1="65" x2="60" y2="40" />
    <!-- Seat to Head Tube (Top Tube) -->
    <line x1="42" y1="44" x2="60" y2="40" />
    <!-- Front Hub to Head Tube (Fork) -->
    <line x1="66" y1="65" x2="60" y2="40" />
    
    <!-- Seat / Saddle -->
    <line x1="37" y1="44" x2="45" y2="44" />
    
    <!-- Handlebars -->
    <path d="M 60,40 L 63,33 L 57,33" />
  </g>
</svg>
