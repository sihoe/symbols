<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 468.33 468.33" role="img" aria-label="Seter – melkespann">
  <title>Seter – melkespann, karttilpasset</title>
  <circle cx="234.165" cy="234.165" r="234.165" fill="#422426"/>

  <!-- Bred, enkel silhuett som holder seg tydelig i liten kartstørrelse -->
  <g transform="translate(234.165 238) scale(1.72 1.42) translate(-171.5 -246)">
    <!-- Korte sidehanker ved skulderen -->
    <path d="M134 190 H122 Q114 190 114 199 V214 Q114 222 122 218 L134 208"
          fill="none" stroke="#EEE9E0" stroke-width="9"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M209 190 H221 Q229 190 229 199 V214 Q229 222 221 218 L209 208"
          fill="none" stroke="#EEE9E0" stroke-width="9"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Spann: tydelig skulder, rette sider og sokkel -->
    <path d="M133 174 H210 V201 L220 216 V337 H122 V216 L133 201 Z" fill="#EEE9E0"/>

    <!-- Stort lokk med enkel bærehank -->
    <ellipse cx="171.5" cy="162" rx="48" ry="17" fill="#EEE9E0"/>
    <ellipse cx="171.5" cy="159" rx="34" ry="8.5" fill="#422426"/>
    <path d="M149 159 H194" fill="none" stroke="#EEE9E0" stroke-width="8" stroke-linecap="round"/>

    <!-- Én kraftig dybdelinje som fortsatt synes på kartet -->
    <path d="M133 174 Q171.5 188 210 174" fill="none" stroke="#422426" stroke-width="3" stroke-linecap="butt"/>

    <!-- Symmetrisk sokkel -->
    <rect x="115" y="337" width="113" height="15" rx="1.5" fill="#EEE9E0"/>
    <path d="M115 337 H228" fill="none" stroke="#422426" stroke-width="1"/>
  </g>
</svg>
